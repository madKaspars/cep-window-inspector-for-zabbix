name: Attach release assets
"on":
  release:
    types: [published]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Verify tag matches manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('manifest.json').read_text())['version']
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag must match manifest.json')
          PY
      - name: Build complete-source archive
        run: python3 scripts/package_release.py
      - name: Attach assets to the already published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" "dist/cep-window-inspector-for-zabbix-$RELEASE_TAG.zip" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY"
